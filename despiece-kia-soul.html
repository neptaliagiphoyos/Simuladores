    gg.traverse(o=>{ if(o.isMesh){ o.userData.pid=p.id; o.castShadow=!o.material.transparent; pickables.push(o); } });
  });
}

// ---------- Lógica de despiece ----------
function partFactor(p){
  if(tab==="pasos"){
    if(p.step==null) return 0;
    return (curStep>0 && p.step<=curStep) ? 1 : 0;
  }
  if(mode==="zona" && !p.zone) return 0;
  if(mode==="desg" && status[p.id]!=="desgaste") return 0;
  return explode;
}
const XRAY_F=["washer","armR","ballR","knuckleR","bearingR","linkR","tieR","shaftR","strutR","railR"], XRAY_FO=["wheelR","linerR","fenderR","bumper","doorFR"];
const XRAY_L=["shaftL","suspL"], XRAY_LO=["wheelFL","fenderL","bumper","doorFL","trans"];
const XRAY_R=["rshock","rbeam"], XRAY_RO=["shell","wheelRR","wheelRL","doorRR","doorRL","rbumper","tailgate","doorFR","doorFL"];
function partOpacity(p){
  if(selected && XRAY_F.includes(selected) && XRAY_FO.includes(p.id)) return .16;
  if(selected && XRAY_R.includes(selected) && XRAY_RO.includes(p.id)) return .14;
  if(selected && XRAY_L.includes(selected) && XRAY_LO.includes(p.id)) return .14;
  if(tab==="pasos" && STEPS[curStep].parts.includes("rshock") && XRAY_RO.includes(p.id)) return .14;
  if(tab==="pasos" && p.step!=null){ return p.step<curStep ? .28 : 1; }
  if(mode==="zona" && !p.zone) return .13;
  if(mode==="desg" && status[p.id]!=="desgaste") return .12;
  return 1;
}
let t0=performance.now();
function tick(now){
  const t=(now-t0)/1000;
  P.forEach(p=>{
    const g=groups[p.id]; if(!g) return;
    const f=partFactor(p);
    const target=p.vec.clone().multiplyScalar(f);
    g.position.lerp(target,.14);
    const op=partOpacity(p);
    let em=null, ei=0;
    if(selected===p.id){ em=0x2a8cff; ei=.75+.25*Math.sin(t*5); }
    else if(tab==="pasos" && p.step===curStep && curStep>0){ em=0xffa020; ei=.35+.25*Math.sin(t*4); }
    else if(tab==="cot" && status[p.id]){ const s=status[p.id]; em= s==="danada"?0xff2a1a : s==="desgaste"?0x8a4dff : s==="revisar"?0xffaa00 : 0x22aa55; ei= s==="ok"?.12:.35; }
    else if(mode==="desg" && status[p.id]==="desgaste"){ em=0x8a4dff; ei=.3+.15*Math.sin(t*3); }
    g.traverse(o=>{ if(!o.isMesh) return; const m=o.material;
      const want=Math.min(op,m.userData.baseOpacity);
      const tr = want<1 || m.userData.baseTransparent;
      if(m.transparent!==tr){ m.transparent=tr; m.needsUpdate=true; }
      m.opacity=want; m.depthWrite = want>.5;
      if(em!=null){ m.emissive.setHex(em); m.emissiveIntensity=ei; } else { m.emissive.setHex(m.userData.baseEmissive); m.emissiveIntensity=m.userData.baseEI; }
    });
  });
  if(camGoal){ controls.target.lerp(camGoal.t,.08); camera.position.lerp(camGoal.p,.08); if(camera.position.distanceTo(camGoal.p)<.01) camGoal=null; }
  controls.update();
  renderer.render(scene,camera);
  updateLabels();
}
let camGoal=null;
function setView(instant){
  const t = mode==="zona" ? new T.Vector3(1.5,.62,.3) : new T.Vector3(0,.75,0);
  const k = camera.aspect<1 ? Math.pow(1/camera.aspect,.75) : 1;
  const p = (mode==="zona" ? new T.Vector3(3.4,1.6,4.1) : new T.Vector3(5.6,3.0,5.6)).sub(t).multiplyScalar(k).add(t);
  if(instant){ controls.target.copy(t); camera.position.copy(p); camGoal=null; } else camGoal={t,p};
}
function focusPart(id){
  const p=byId[id]; if(!p||!p.center||!controls) return;
  const c=p.center.clone().add(p.vec.clone().multiplyScalar(partFactor(p)));
  const dir=camera.position.clone().sub(controls.target).normalize();
  // mirar desde el lado donde está la pieza
  if((p.center.z<-.2 && dir.z>0) || (p.center.z>.2 && dir.z<0)) dir.z*=-1;
  if(XRAY_F.includes(id)||XRAY_L.includes(id)) dir.set(.35,.42,p.center.z<0?-1:1).normalize();
  const k=camera.aspect<1?Math.pow(1/camera.aspect,.6):1; const dist=Math.max(camera.aspect<1?2.4:1.8,Math.min(3.6,camera.position.distanceTo(controls.target)))*k;
  camGoal={t:c,p:c.clone().add(dir.multiplyScalar(dist))};
}
function setupPicking(){
  const ray=new T.Raycaster(), v=new T.Vector2(); let down=null;
  canvas.addEventListener("pointerdown",e=>{ down={x:e.clientX,y:e.clientY}; });
  canvas.addEventListener("pointerup",e=>{
    if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; down=null;
    if(dx*dx+dy*dy>64) return;
    const r=canvas.getBoundingClientRect(); v.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(v,camera);
    const hits=ray.intersectObjects(pickables.filter(o=>{ const p=byId[o.userData.pid]; return o.visible && (mode!=="zona"||p.zone) && p.id!=="shell"; }),false);
    if(hits.length) select(hits[0].object.userData.pid,false); else select(null);
  });
}

// ---------- Tarjeta de selección ----------
const LABELS=[["armR","Trapecio"],["strutR","Amortiguador del."],["knuckleR","Mangueta"],["headR","Faro der."],["headL","Faro izq."],["fenderR","Guardafango"],["bumper","Parachoques"],["rad","Radiador"],["washer","Tanque limpiaparabrisas"],["mirrorR","Espejo der."],["shaftR","Palier der."],["shaftL","Palier izq."],["rshock","Amortiguadores traseros"],["rbeam","Eje trasero"]];
const labEls={}; const labHost=document.getElementById("labels");
LABELS.forEach(([id,t])=>{ const b=document.createElement("button"); b.className="lab"+(id==="armR"||id==="rshock"?" key":""); b.textContent=t; b.onclick=()=>select(id); labHost.appendChild(b); labEls[id]=b; });
const _v=new (window.THREE?THREE.Vector3:Object)();
function updateLabels(){
  const w=stage.clientWidth,h=stage.clientHeight, placed=[];
  // prioridad: claves, luego dañadas/desgaste, luego el resto; se ocultan las que se encimarían
  const pr=id=>(id==="armR"||id==="rshock"?0:(status[id]==="danada"||status[id]==="desgaste")?1:2);
  LABELS.slice().sort((a,b)=>pr(a[0])-pr(b[0])).forEach(([id])=>{ const p=byId[id], el=labEls[id], g=groups[id];
    let show = labelsOn && g && selected!==id && (mode!=="zona" || p.zone) && partOpacity(p)>.2 && !(tab==="pasos");
    let x=0,y=0;
    if(show){ _v.copy(p.center).add(g.position); if(id==="armR") _v.set(1.25,.24,.5).add(g.position); _v.project(camera); show = _v.z<1 && Math.abs(_v.x)<1.05 && Math.abs(_v.y)<1.05; x=(_v.x+1)/2*w; y=(1-_v.y)/2*h; }
    if(show){ if(!el._w){ el.hidden=false; el._w=el.offsetWidth; el._h=el.offsetHeight; }
      const r={l:x-el._w/2-3,r:x+el._w/2+3,t:y-el._h-8,b:y-4};
      if(placed.some(q=>r.l<q.r&&r.r>q.l&&r.t<q.b&&r.b>q.t)) show=false; else placed.push(r); }
    el.hidden=!show; if(show){ el.style.left=x+"px"; el.style.top=y+"px"; el.setAttribute("aria-current",String(selected===id)); } });
}
let labelsOn=true;
function select(id,focus){
  selected=id; const card=$("#card");
  if(!id){ card.hidden=true; document.querySelector('.main').classList.remove('has-card'); if(renderer) resize(); renderLists(); return; }
  const p=byId[id];
  $("#cName").textContent=p.es; $("#cEn").textContent=p.en;
  $("#cOem").textContent=p.oem; $("#cAlt").textContent=p.alt?"Alternativa: "+p.alt:""; $("#cAlt").hidden=!p.alt;
  $("#cSide").textContent=p.side;
  $("#cPriceWrap").hidden=p.usd==null; $("#cPrice").textContent=fmt(p.usd)+(p.qty?" c/u × "+p.qty:"")+" (EE. UU.)";
  $("#cStepWrap").hidden=!(p.zone&&p.step!=null); $("#cStep").textContent=p.step!=null?p.step+" · "+STEPS[p.step].t:"";
  $("#cNote").textContent=p.note||""; $("#cNote").hidden=!p.note;
  $("#cStatus").hidden=p.id==="shell";
  $("#cStatus").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(status[id]===b.dataset.s)));
  const l=$("#cLink"); l.hidden=!p.url; if(p.url) l.href=p.url; l.textContent=p.url.includes("7zap")?"Ver diagrama OEM (7zap)":"Ver en catálogo OEM";
  $("#cCopyWrap").hidden=!/\d{5}-/.test(p.oem);
  card.hidden=false; document.querySelector('.main').classList.add('has-card'); resize();
  if(focus!==false) focusPart(id);
  renderLists();
}
$("#cardClose").onclick=()=>select(null);
$("#labToggle").onclick=()=>{ labelsOn=!labelsOn; $("#labToggle").setAttribute("aria-pressed",String(labelsOn)); };
$("#cStatus").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!selected) return; status[selected]=b.dataset.s; save(); select(selected,false); });
$("#cCopy").onclick=e=>{ e.preventDefault(); if(selected) copyText(byId[selected].oem); };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }
function copyText(txt,fallbackHost){
  const done=()=>toast("Copiado");
  const fb=()=>{ if(fallbackHost){ let ta=fallbackHost.querySelector("textarea"); if(!ta){ ta=document.createElement("textarea"); ta.className="fallback"; ta.id="fallbackText"; fallbackHost.appendChild(ta);} ta.value=txt; ta.focus(); ta.select(); toast("Selecciona y copia el texto"); } else toast("No se pudo copiar: "+txt); };
  try{ navigator.clipboard.writeText(txt).then(done,fb); }catch(e){ fb(); }
}

// ---------- Listas ----------
function renderPiezas(){
  const v=$("#vPiezas"); const groupsOrder=["Frente y luces","Carrocería","Enfriamiento","Suspensión y dirección","Suspensión trasera","Estructura","Motor","Resto del carro"];
  let h="";
  const row=p=>{ const s=status[p.id]||""; return `<button class="row" data-id="${p.id}" aria-current="${selected===p.id}"><span class="dot ${s}" title="${ST_LABEL[s]||""}"></span><span class="nm">${p.es}<span>${p.en} · ${p.oem}</span></span><span class="step">${p.step!=null?"P"+p.step:""}</span></button>`; };
  if(mode==="desg"){ const w=P.filter(p=>status[p.id]==="desgaste");
    h+=`<h3>Cambio por desgaste (${w.length})</h3>`+(w.length?w.map(row).join(""):`<p class="small">Aún no marcaste ninguna pieza.</p>`);
    h+=`<p class="small" style="margin-top:8px">Para agregar otra, tócala en esta lista o en el modelo y elige «Desgaste».</p><h3 style="margin-top:18px">Todas las piezas</h3>`; }
  groupsOrder.forEach(gn=>{
    const items=P.filter(p=>p.grp===gn && p.id!=="shell" && (mode!=="zona"||p.zone)); if(!items.length) return;
    h+=`<h3>${gn}</h3>`;
    items.forEach(p=>{ h+=row(p); });
  });
  if(mode==="zona") h+=`<p class="small">Las piezas por desgaste, como los amortiguadores traseros, están en el botón «Desgaste».</p>`;
  v.innerHTML=h;
}
function renderPasos(){
  const s=STEPS[curStep], v=$("#vPasos");
  let h=`<div class="stepnav"><button class="btn" id="prevS" aria-label="Paso anterior" ${curStep===0?"disabled":""}>‹</button><div class="lbl">Paso ${curStep} de ${STEPS.length-1}</div><button class="btn primary" id="nextS" aria-label="Paso siguiente" ${curStep===STEPS.length-1?"disabled":""}>›</button></div>`;
  h+=`<div class="steptitle">${s.t}</div>`;
  if(s.parts.length) h+=`<div class="chips">${s.parts.map(id=>`<button class="chip" data-id="${id}">${byId[id].es}</button>`).join("")}</div>`;
  h+=`<ol class="inst">${s.inst.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  h+=`<div class="tools"><b>Herramientas:</b> ${s.tools}</div>`;
  if(s.warn) h+=`<div class="warnbox">${s.warn}</div>`;
  h+=`<div class="dots" aria-label="Ir a un paso">${STEPS.map((x,i)=>`<button data-step="${i}" class="${i<curStep?"done":""}" aria-current="${i===curStep}" title="${x.t}">${i}</button>`).join("")}</div>`;
  h+=`<p class="small" style="margin-top:12px">Para rearmar, sigue los pasos al revés y termina con una alineación. Los torques vienen de los videos de 1A Auto para el Soul 2010–2013; confírmalos con el manual de taller.</p>`;
  v.innerHTML=h;
  $("#prevS").onclick=()=>goStep(curStep-1); $("#nextS").onclick=()=>goStep(curStep+1);
}
function goStep(i){ curStep=Math.max(0,Math.min(STEPS.length-1,i)); if(selected) select(null); renderPasos(); $("#vPasos").scrollTop=0; const ids=STEPS[curStep].parts; if(ids.length){ focusStep(ids); } else setView(false); }
function focusStep(ids){ if(!controls) return; const c=new T.Vector3(); ids.forEach(id=>{ const p=byId[id]; c.add(p.center.clone().add(p.vec)); }); c.multiplyScalar(1/ids.length);
  const dir=camera.position.clone().sub(controls.target).normalize(); const k=camera.aspect<1?Math.pow(1/camera.aspect,.6):1; camGoal={t:c,p:c.clone().add(dir.multiplyScalar(3.2*k))}; }

let qFilter="todo";
const QF={choque:s=>s==="danada", desg:s=>s==="desgaste", ambos:s=>s==="danada"||s==="desgaste", todo:s=>s==="danada"||s==="desgaste"||s==="revisar"};
function quoteItems(){ const order={danada:0,desgaste:1,revisar:2}; return P.filter(p=>p.id!=="battery" && p.id!=="shell" && QF[qFilter](status[p.id])).sort((a,b)=>order[status[a.id]]-order[status[b.id]]); }
function renderCot(){
  const v=$("#vCot"), items=quoteItems();
  const tot=items.reduce((a,p)=>a+(p.usd||0)*(p.qty||1),0), sinP=items.filter(p=>p.usd==null).length;
  let h=`<div class="fields"><label for="vin">VIN (17 caracteres)<input id="vin" maxlength="17" autocomplete="off" autocapitalize="characters" value="${vin.replace(/"/g,"")}" placeholder="Escribe tu VIN"></label>
  <label for="motor">Motor<select id="motor">${["No sé","1.6 Gamma","2.0 Nu"].map(m=>`<option ${m===motor?"selected":""}>${m}</option>`).join("")}</select></label></div>`;
  h+=`<div class="filt" role="group" aria-label="Qué piezas incluir">${[["choque","Choque"],["desg","Desgaste"],["ambos","Choque + desgaste"],["todo","Todo + revisar"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${qFilter===k}">${t}</button>`).join("")}</div>`;
  if(!items.length) h+=`<p class="small">No hay piezas con ese estado. Toca una pieza en el modelo y márcala como «Dañada» o «Desgaste».</p>`;
  items.forEach(p=>{ h+=`<div class="q"><div><div class="es">${p.es}</div><div class="enl">${p.en}</div></div><div class="pr">${p.qty&&p.usd!=null?p.qty+" × "+fmt(p.usd):fmt(p.usd)}</div>
    <div class="sub"><span class="oem">${p.oem}</span><span>${p.side}</span>${p.alt?`<span>alt.: ${p.alt}</span>`:""}<span class="dot ${status[p.id]}" style="display:inline-block"></span><span>${ST_LABEL[status[p.id]]}</span></div></div>`; });
  h+=`<div class="total"><span>Referencia EE. UU. (${items.length} piezas${sinP?`, ${sinP} sin precio`:""})</span><span>US$ ${tot.toFixed(2)}</span></div>`;
  h+=`<div class="copyrow"><button class="btn primary" id="copyList">Copiar lista para proveedores</button></div><div id="fbHost"></div>`;
  h+=`<p class="small">Precios de KiaPartsNow en dólares, sin envío ni impuestos, a noviembre de 2026. Sirven para comparar, no son precios en Lima. Pide siempre la cotización con tu VIN: el concesionario te confirma el código exacto aunque luego compres en otra tienda.</p>`;
  v.innerHTML=h;
  $("#vin").oninput=e=>{ vin=e.target.value.toUpperCase(); save(); };
  $("#motor").onchange=e=>{ motor=e.target.value; save(); };
  v.querySelectorAll(".filt button").forEach(b=>b.onclick=()=>{ qFilter=b.dataset.f; renderCot(); });
  $("#copyList").onclick=()=>copyText(quoteText(), $("#fbHost"));
}
function quoteText(){
  const items=quoteItems();
  let s=`Hola, quisiera cotizar repuestos para un Kia Soul 2013`+(motor!=="No sé"?` motor ${motor}`:"")+(vin?`, VIN ${vin}`:"")+`. Lado derecho = copiloto.\n\n`;
  items.forEach((p,i)=>{ s+=`${i+1}. ${p.qty?p.qty+" × ":""}${p.es} (${p.en})`+(/\d{5}-/.test(p.oem)?` – código OEM ${p.oem}`:"")+(p.alt?` (o ${p.alt})`:"")+` – ${p.side}`+(status[p.id]==="desgaste"?" – cambio por desgaste":"")+`\n`; });
  s+=`\nPor favor indicar precio, si es original o alternativo, y tiempo de entrega. Gracias.`;
  return s;
}
function renderLists(){ if(tab==="piezas") renderPiezas(); if(tab==="cot") renderCot(); }

// ---------- Pestañas y controles ----------
function setTab(t){
  tab=t; ["piezas","pasos","cot"].forEach(k=>{ $("#v"+({piezas:"Piezas",pasos:"Pasos",cot:"Cot"})[k]).hidden=k!==t; });
  $("#tPiezas").setAttribute("aria-selected",String(t==="piezas")); $("#tPasos").setAttribute("aria-selected",String(t==="pasos")); $("#tCot").setAttribute("aria-selected",String(t==="cot"));
  $("#ctrlExplode").hidden=t==="pasos"; $("#legend").hidden=t!=="cot";
  if(t==="pasos"){ if(mode!=="zona") setMode("zona"); renderPasos(); } else if(controls && !selected) setView(false);
  renderLists();
}
$("#tPiezas").onclick=()=>setTab("piezas"); $("#tPasos").onclick=()=>setTab("pasos"); $("#tCot").onclick=()=>setTab("cot");
function setMode(m){ mode=m; $("#mZona").setAttribute("aria-pressed",String(m==="zona")); $("#mTodo").setAttribute("aria-pressed",String(m==="todo")); $("#mDesg").setAttribute("aria-pressed",String(m==="desg"));
  if(selected && m==="zona" && !byId[selected].zone) select(null);
  if(controls) setView(false); if(m!=="zona" && tab==="pasos") setTab("piezas"); renderLists(); }
$("#mZona").onclick=()=>setMode("zona"); $("#mTodo").onclick=()=>setMode("todo"); $("#mDesg").onclick=()=>setMode("desg");
$("#explode").oninput=e=>{ explode=e.target.value/100; };
$("#reset").onclick=()=>{ explode=0; $("#explode").value=0; };
document.addEventListener("click",e=>{
  const r=e.target.closest(".row,.chip"); if(r&&r.dataset.id){ select(r.dataset.id); return; }
  const d=e.target.closest(".dots button"); if(d){ goStep(+d.dataset.step); }
});

renderPiezas();
if(T && T.OrbitControls){ try{ initThree(); }catch(err){ console.error(err); stage.insertAdjacentHTML("beforeend",'<div class="err">Tu navegador no pudo iniciar el visor 3D. Las listas de piezas y pasos siguen funcionando abajo.</div>'); } }
})();
</script>
