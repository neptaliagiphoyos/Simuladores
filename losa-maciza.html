16 9\"/><path d=\"M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z\"/><\/svg>',\n  };\n  const TABS = [['planta', 'Planta'], ['datos', 'Datos'], ['porticos', 'Pórticos'], ['acero', 'Acero'], ['revisar', 'Revisar']];\n\n  function recompute() { O = solve(D); store(KEY, JSON.stringify(D)); header(); tabs(); render(); }\n\n  function counts() {\n    const n = { ok: 0, warn: 0, bad: 0 };\n    O.rows.forEach(r => n[r.st]++);\n    O.lim.forEach(l => { if (l.st !== 'ok') n[l.st]++; });\n    return n;\n  }\n  function header() {\n    const n = counts();\n    $('sub').textContent = `${O.nPan} paños · hf ${r2(O.hf.v)} m · viga ${r2(O.viga.b.v)}×${r2(O.viga.h.v)}`;\n    $('st').innerHTML = `<span class=\"ok\" title=\"Cumplen\">${n.ok}<\/span>${n.warn ? `<span class=\"warn\" title=\"Por revisar\">${n.warn}<\/span>` : ''}${n.bad ? `<span class=\"bad\" title=\"Fallan\">${n.bad}<\/span>` : ''}`;\n  }\n  function tabs() {\n    const n = counts();\n    $('tabs').innerHTML = TABS.map(([id, t]) => `<button type=\"button\" role=\"tab\" id=\"tab-${id}\" data-t=\"${id}\" aria-selected=\"${ui.tab === id}\">${ICON[id]}${t}${id === 'revisar' && (n.warn + n.bad) ? `<i class=\"${n.bad ? 'bad' : ''}\">${n.warn + n.bad}<\/i>` : ''}<\/button>`).join('');\n  }\n  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.t); });\n  function go(t, rowId) {\n    ui.tab = t; saveUi(); closeSheet(); tabs(); render();\n    window.scrollTo(0, 0);\n    if (rowId) {\n      const el = document.querySelector(`[data-row=\"${CSS.escape(rowId)}\"]`);\n      if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); }\n    }\n  }\n  function render() {\n    $('main').innerHTML = { planta: tPlanta, datos: tDatos, porticos: tPorticos, acero: tAcero, revisar: tRevisar }[ui.tab]();\n  }\n\n  // ------------------------------------------------------------------ fórmula\n  function closeSheet() { $('sheet').hidden = true; document.querySelectorAll('.v.on').forEach(x => x.classList.remove('on')); }\n  $('shx').addEventListener('click', closeSheet);\n  $('main').addEventListener('click', e => {\n    const v = e.target.closest('.v'); if (!v) return;\n    document.querySelectorAll('.v.on').forEach(x => x.classList.remove('on'));\n    v.classList.add('on');\n    $('shk').textContent = v.dataset.k || 'Fórmula';\n    $('shf').textContent = v.dataset.f || 'Dato de entrada';\n    $('sheet').hidden = false;\n  });\n  $('main').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && (e.target.classList.contains('v') || e.target.closest('.pan'))) { e.preventDefault(); e.target.click(); } });\n\n  // ------------------------------------------------------------------ planta\n  function tPlanta() {\n    const sp = (arr, key, lbl) => arr.map((v, i) => `<div class=\"sp\"><em>${lbl(i)}<\/em><input class=\"in\" id=\"sp-${key}-${i}\" data-sk=\"${key}\" data-i=\"${i}\" inputmode=\"decimal\" value=\"${v}\" aria-label=\"Luz ${lbl(i)} (m)\"><button type=\"button\" class=\"x\" data-del=\"${key}\" data-i=\"${i}\" aria-label=\"Quitar tramo ${lbl(i)}\"${arr.length < 2 ? ' disabled' : ''}>×<\/button><\/div>`).join('');\n    return `<div class=\"card\">${plan()}\n      <div class=\"legend\"><span><i class=\"sw\" style=\"background:var(--slab)\"><\/i>Paño<\/span><span><i class=\"sw\" style=\"background:var(--hatch)\"><\/i>Vacío<\/span><span><i class=\"sw\" style=\"background:var(--beam);height:4px;vertical-align:2px\"><\/i>Viga<\/span><\/div>\n      <p class=\"hint\">Toca un paño para quitarlo o agregarlo.<\/p><\/div>\n    <h2>Luces en X-X (m)<\/h2><div class=\"spans\">${sp(D.Lx, 'Lx', tnX)}<button type=\"button\" class=\"add\" id=\"addX\">+ Paño X-X<\/button><\/div>\n    <h2>Luces en Y-Y (m)<\/h2><div class=\"spans\">${sp(D.Ly, 'Ly', tnY)}<button type=\"button\" class=\"add\" id=\"addY\">+ Paño Y-Y<\/button><\/div>\n    <h2>Resultado<\/h2><div class=\"kv\">\n      <div><span>Espesor de losa hf<\/span>${V(O.hf.v, O.hf.f, 2, 'hf (m)')}<\/div>\n      <div><span>Viga b × h (m)<\/span><b>${r2(O.viga.b.v)} × ${r2(O.viga.h.v)}<\/b><\/div>\n      <div><span>wu (t/m²)<\/span>${V(O.carga.wu.v, O.carga.wu.f, 4, 'wu')}<\/div>\n      <div><span>Columna (cm)<\/span><b>${O.col ? O.col.lado + ' × ' + O.col.lado : '—'}<\/b><\/div>\n      <div><span>Paños<\/span><b>${O.nPan}<\/b><\/div>\n      <div><span>Área (m²)<\/span><b>${fx(O.panels.reduce((t, p) => t + p.lx * p.ly, 0), 1)}<\/b><\/div>\n    <\/div>\n    <button type=\"button\" class=\"btn\" id=\"reset\">Volver a la planta original<\/button>`;\n  }\n  function plan() {\n    const W = D.Lx.reduce((a, b) => a + b, 0), H = D.Ly.reduce((a, b) => a + b, 0);\n    const s = 520 / Math.max(W, H), m = 50;\n    const xs = [0], ys = [0];\n    D.Lx.forEach(v => xs.push(xs[xs.length - 1] + v * s)); D.Ly.forEach(v => ys.push(ys[ys.length - 1] + v * s));\n    const X = xs[xs.length - 1], Y = ys[ys.length - 1];\n    let g = `<svg class=\"plan\" viewBox=\"${-m} ${-m} ${X + m + 44} ${Y + m + 40}\" role=\"group\" aria-label=\"Planta de la losa\"><defs><pattern id=\"hatch\" width=\"9\" height=\"9\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"9\" height=\"9\" fill=\"var(--slab-off)\"><\/rect><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"9\" stroke=\"var(--hatch)\" stroke-width=\"3\"><\/line><\/pattern><\/defs>`;\n    for (let j = 0; j < D.Ly.length; j++) for (let i = 0; i < D.Lx.length; i++) {\n      const on = O.P(j, i), w = xs[i + 1] - xs[i], h = ys[j + 1] - ys[j], cx = xs[i] + w / 2, cy = ys[j] + h / 2;\n      g += `<g class=\"pan${on ? '' : ' off'}\" tabindex=\"0\" role=\"button\" aria-pressed=\"${on}\" aria-label=\"${on ? 'Quitar paño ' + O.num[j][i] : 'Agregar paño'}\" data-j=\"${j}\" data-i=\"${i}\"><rect x=\"${xs[i]}\" y=\"${ys[j]}\" width=\"${w}\" height=\"${h}\"><\/rect>${on ? `<text class=\"num\" x=\"${cx}\" y=\"${cy + (h > 60 ? 0 : 7)}\" text-anchor=\"middle\">${O.num[j][i]}<\/text>${h > 60 ? `<text class=\"sub\" x=\"${cx}\" y=\"${cy + 18}\" text-anchor=\"middle\">${r2(D.Lx[i])}×${r2(D.Ly[j])}<\/text>` : ''}` : `<text class=\"sub\" x=\"${cx}\" y=\"${cy + 5}\" text-anchor=\"middle\">+<\/text>`}<\/g>`;\n    }\n    xs.forEach((x, k) => { g += `<line class=\"axis\" x1=\"${x}\" y1=\"${-m + 26}\" x2=\"${x}\" y2=\"${Y + 6}\"><\/line><g class=\"bub\"><circle cx=\"${x}\" cy=\"${-m + 13}\" r=\"12\"><\/circle><text x=\"${x}\" y=\"${-m + 18}\" text-anchor=\"middle\">${LETTERS(k)}<\/text><\/g>`; });\n    ys.forEach((y, k) => { g += `<line class=\"axis\" x1=\"${-m + 26}\" y1=\"${y}\" x2=\"${X + 6}\" y2=\"${y}\"><\/line><g class=\"bub\"><circle cx=\"${-m + 13}\" cy=\"${y}\" r=\"12\"><\/circle><text x=\"${-m + 13}\" y=\"${y + 5}\" text-anchor=\"middle\">${k + 1}<\/text><\/g>`; });\n    O.fx.forEach(L => L.runs.forEach(r => { g += `<line class=\"beam\" x1=\"${xs[r.spans[0].s]}\" y1=\"${ys[L.k]}\" x2=\"${xs[r.spans[r.spans.length - 1].s + 1]}\" y2=\"${ys[L.k]}\"><\/line>`; }));\n    O.fy.forEach(L => L.runs.forEach(r => { g += `<line class=\"beam\" x1=\"${xs[L.k]}\" y1=\"${ys[r.spans[0].s]}\" x2=\"${xs[L.k]}\" y2=\"${ys[r.spans[r.spans.length - 1].s + 1]}\"><\/line>`; }));\n    for (let y = 0; y < ys.length; y++) for (let x = 0; x < xs.length; x++) if ([[y - 1, x - 1], [y - 1, x], [y, x - 1], [y, x]].some(([a, b]) => O.P(a, b))) g += `<rect class=\"col\" x=\"${xs[x] - 7}\" y=\"${ys[y] - 7}\" width=\"14\" height=\"14\"><\/rect>`;\n    D.Lx.forEach((v, i) => { g += `<text class=\"dimt\" x=\"${(xs[i] + xs[i + 1]) / 2}\" y=\"${Y + 30}\" text-anchor=\"middle\">${r2(v)}<\/text><line class=\"dim\" x1=\"${xs[i]}\" y1=\"${Y + 14}\" x2=\"${xs[i]}\" y2=\"${Y + 34}\"><\/line>`; });\n    g += `<line class=\"dim\" x1=\"${X}\" y1=\"${Y + 14}\" x2=\"${X}\" y2=\"${Y + 34}\"><\/line>`;\n    D.Ly.forEach((v, j) => { g += `<text class=\"dimt\" x=\"${X + 16}\" y=\"${(ys[j] + ys[j + 1]) / 2 + 5}\">${r2(v)}<\/text><line class=\"dim\" x1=\"${X + 10}\" y1=\"${ys[j]}\" x2=\"${X + 40}\" y2=\"${ys[j]}\"><\/line>`; });\n    g += `<line class=\"dim\" x1=\"${X + 10}\" y1=\"${Y}\" x2=\"${X + 40}\" y2=\"${Y}\"><\/line>`;\n    return g + `<\/svg>`;\n  }\n  $('main').addEventListener('click', e => {\n    const p = e.target.closest('.pan');\n    if (p) { const j = +p.dataset.j, i = +p.dataset.i; if (O.P(j, i) && O.nPan <= 1) return; D.mask[j][i] = O.P(j, i) ? 0 : 1; return recompute(); }\n    const t = e.target.closest('button'); if (!t) return;\n    if (t.id === 'addX') { D.Lx.push(D.Lx[D.Lx.length - 1]); D.mask.forEach(r => r.push(1)); D.over = {}; return recompute(); }\n    if (t.id === 'addY') { D.Ly.push(D.Ly[D.Ly.length - 1]); D.mask.push(D.Lx.map(() => 1)); D.over = {}; return recompute(); }\n    if (t.id === 'reset') { D = ORIGINAL(); return recompute(); }\n    if (t.dataset.del) {\n      const i = +t.dataset.i;\n      if (t.dataset.del === 'Lx' && D.Lx.length > 1) { D.Lx.splice(i, 1); D.mask.forEach(r => r.splice(i, 1)); }\n      if (t.dataset.del === 'Ly' && D.Ly.length > 1) { D.Ly.splice(i, 1); D.mask.splice(i, 1); }\n      if (!D.mask.some(r => r.some(Boolean))) D.mask[0][0] = 1;\n      D.over = {}; return recompute();\n    }\n    if (t.dataset.u) { ui[t.dataset.u] = t.dataset.v; saveUi(); closeSheet(); return render(); }\n    if (t.classList.contains('chk')) return go(t.dataset.tab === 'acero' ? 'acero' : 'datos', t.dataset.id);\n  });\n  $('main').addEventListener('change', e => {\n    const el = e.target;\n    if (el.dataset.sk) {\n      const v = parseFloat(String(el.value).replace(',', '.'));\n      if (!Number.isFinite(v) || v < 1 || v > 20) { el.value = D[el.dataset.sk][+el.dataset.i]; return; }\n      D[el.dataset.sk][+el.dataset.i] = v; return recompute();\n    }\n    if (el.dataset.k) {\n      const k = el.dataset.k;\n      if (k === 'sismo') D.sismo = el.value === '1';\n      else { const v = parseFloat(String(el.value).replace(',', '.')); if (!Number.isFinite(v) || v <= 0) { el.value = D[k]; return; } D[k] = v; }\n      return recompute();\n    }\n    if (el.dataset.ov) {\n      D.over       h += `<div class=\"fld\"><label for=\"in-${k}\">${lab}<\/label>${c}<span class=\"u\">${u}<\/span><\/div>`;\n      });\n      h += `<\/div>`;\n    });\n    const v = O.viga, c = O.col;\n    h += `<h2>Predimensionamiento<\/h2><div class=\"kv\">\n      <div><span>Luz mayor (m)<\/span>${V(v.Lmax.v, v.Lmax.f, 2, 'Luz mayor')}<\/div><div><span>h = L/12 (m)<\/span>${V(v.hL12.v, v.hL12.f, 3, 'h = L/12')}<\/div>\n      <div><span>Viga h (m)<\/span>${V(v.h.v, v.h.f, 2, 'h viga')}<\/div><div><span>Viga b (m)<\/span>${V(v.b.v, v.b.f, 2, 'b viga')}<\/div>\n      <div><span>C torsión (m⁴)<\/span>${V(O.tor.C, O.tor.f, 5, 'C')}<\/div><div><span>CM (kg/m²)<\/span>${V(O.carga.cm.v, O.carga.cm.f, 1, 'CM')}<\/div>\n      ${c ? `<div><span>P columna (kg)<\/span>${V(c.Pt, c.f.Pt, 0, 'P')}<\/div><div><span>Ac (cm²)<\/span>${V(c.Ac, c.f.Ac, 1, 'Ac')}<\/div>` : ''}\n    <\/div><h2>Espesor por paño<\/h2>`;\n    const hmax = Math.max(...O.panels.map(p => p.h));\n    O.panels.forEach(p => {\n      h += `<div class=\"card\" data-row=\"p${p.n}\"><h3>Paño ${p.n} <small>${r2(p.lx)} × ${r2(p.ly)} m<\/small><\/h3><div class=\"kv\">\n        <div><span>αm<\/span>${V(p.am, p.f.am, 3, 'αm')}<\/div><div><span>β<\/span>${V(p.beta, p.f.beta, 3, 'β')}<\/div>\n        <div><span>ln (m)<\/span>${V(p.ln, p.f.ln, 2, 'ln')}<\/div><div><span>h requerido (m)${Math.abs(p.h - hmax) < 1e-9 ? ' · manda' : ''}<\/span>${V(p.h, p.f.h, 4, 'h')}<\/div><\/div>\n        <details class=\"more\"><summary>α de cada lado<\/summary><div class=\"kv\">${p.sides.map(s => `<div><span>${s.k}${s.edge ? ' (borde)' : ''}<\/span>${V(s.a, `α = Ib/Is = ${r2(s.Ib, 6)}/(${r2(s.w)}·hfo³/12) = ${r2(s.a, 3)}`, 3, 'α ' + s.k)}<\/div>`).join('')}<\/div><\/details><\/div>`;\n    });\n    return h;\n  }\n\n  // ------------------------------------------------------------------ pórticos\n  function tPorticos() {\n    const segBtn = (v, t) => `<button type=\"button\" data-u=\"pdir\" data-v=\"${v}\" aria-pressed=\"${ui.pdir === v}\">${t}<\/button>`;\n    let h = `<div class=\"seg\">${segBtn('X', 'X-X')}${segBtn('Y', 'Y-Y')}${segBtn('C', 'Centrales')}<\/div>`;\n    if (ui.pdir === 'C') {\n      O.mid.forEach(m => {\n        h += `<div class=\"card\"><h3>Paño ${m.n} <small>${r2(O.panels.find(p => p.n === m.n).lx)} × ${r2(O.panels.find(p => p.n === m.n).ly)} m<\/small><\/h3><div class=\"secs\"><div class=\"sec hd\"><span>Dir.<\/span><span>1-1<\/span><span>2-2<\/span><span>3-3<\/span><\/div>`;\n        ['X', 'Y'].forEach(d => { const s = m[d]; h += `<div class=\"sec\"><span><b>${d}-${d}<\/b><br><small style=\"color:var(--muted)\">ancho ${V(s.w, s.fw, 2, 'Ancho franja')}<\/small><\/span>${s.M.map((v, q) => `<span>${V(v, s.f[q], 2, `M ${d}-${d} ${q + 1}-${q + 1} (t·m)`)}<\/span>`).join('')}<\/div>`; });\n        h += `<\/div><\/div>`;\n      });\n      return h + `<p class=\"hint\">Momentos en t·m que recibe la franja central de cada paño.<\/p>`;\n    }\n    const lines = ui.pdir === 'X' ? O.fx : O.fy, tn = ui.pdir === 'X' ? tnX : tnY;\n    if (!lines.some(l => l.name === ui.peje)) ui.peje = lines[0] && lines[0].name;\n    h += `<div class=\"chips\" role=\"group\" aria-label=\"Eje\">${lines.map(l => `<button type=\"button\" data-u=\"peje\" data-v=\"${l.name}\" aria-pressed=\"${l.name === ui.peje}\">Eje ${l.name}<\/button>`).join('')}<\/div>`;\n    const L = lines.find(l => l.name === ui.peje);\n    if (!L) return h + `<p class=\"empty\">No hay vigas en esta dirección.<\/p>`;\n    L.runs.forEach(run => run.spans.forEach(sp => {\n      h += `<div class=\"card\"><h3>${run.beam} · tramo ${tn(sp.s)} <small>Mo ${V(sp.Mo, sp.f.Mo, 2, 'Mo (t·m)')}<\/small><\/h3>\n        <div class=\"kv\"><div><span>l1 / ln (m)<\/span><b>${fx(sp.l1)} / ${V(sp.ln, sp.f.ln, 2, 'ln')}<\/b><\/div><div><span>l2 (m)<\/span>${V(sp.l2, sp.f.l2, 2, 'l2')}<\/div>\n        <div><span>α1·l2/l1<\/span>${V(sp.a1, sp.f.a1, 2, 'α1·l2/l1')}<\/div><div><span>βt<\/span>${V(sp.bt, sp.f.bt, 3, 'βt')}<\/div><\/div>\n        <div class=\"secs\"><div class=\"sec hd\"><span>Sección<\/span><span>Viga<\/span><span>Losa f. col.<\/span><span>A centrales<\/span><\/div>\n        ${sp.secs.map((c, q) => `<div class=\"sec\"><span>${q + 1}-${q + 1} <small style=\"color:var(--muted)\">${SECT(c.t)}<\/small><br><small style=\"color:var(--muted)\">${fx(c.coef)}·Mo · ${V(c.pct, c.f.pct, 0, '% franja de columna')}%<\/small><\/span><span><b>${V(c.Mv, c.f.Mv, 2, 'M viga (t·m)')}<\/b><\/span><span>${V(c.Mcs, c.f.Mcs, 2, 'M losa franja col. (t·m)')}<\/span><span>${V(c.rem, c.f.rem, 2, 'M a franjas centrales (t·m)')}<\/span><\/div>`).join('')}\n        <\/div><\/div>`;\n    }));\n    return h + `<p class=\"hint\">Momentos en t·m. Toca un número subrayado para ver su fórmula.<\/p>`;\n  }\n\n  // ------------------------------------------------------------------ acero\n  function tAcero() {\n    const b = (u, v, t) => `<button type=\"button\" data-u=\"${u}\" data-v=\"${v}\" aria-pressed=\"${ui[u] === v}\">${t}<\/button>`;\n    let h = `<div class=\"seg\">${b('adir', 'X', 'X-X')}${b('adir', 'Y', 'Y-Y')}<\/div>\n      <div class=\"seg\">${b('akind', 'V', 'Vigas')}${b('akind', 'C', 'Franja col.')}${b('akind', 'M', 'Franja central')}<\/div>`;\n    let rows = O.rows.filter(R => R.id[0] === ui.adir && R.kind === ui.akind);\n    if (ui.akind !== 'M') {\n      const ejes = [...new Set(rows.map(R => R.grp.split('|')[1]))];\n      if (!ejes.includes(ui.aeje)) ui.aeje = ejes[0];\n      h += `<div class=\"chips\" role=\"group\" aria-label=\"Eje\">${ejes.map(e => { const bad = rows.some(R => R.grp.split('|')[1] === e && R.st !== 'ok'); return `<button type=\"button\" data-u=\"aeje\" data-v=\"${e}\" aria-pressed=\"${e === ui.aeje}\">Eje ${e}${bad ? ' •' : ''}<\/button>`; }).join('')}<\/div>`;\n      rows = rows.filter(R => R.grp.split('|')[1] === ui.aeje);\n    }\n    const tn = ui.adir === 'X' ? tnX : tnY;\n    rows.forEach(R => {\n      const o = D.over[R.id] || {};\n      const sel = (k, opts, cur, lab) => `<label>${lab}<select class=\"in${o[k] ? ' mod' : ''}\" id=\"ov-${R.id}-${k}\" data-ov=\"${R.id}\" data-ok=\"${k}\">${opts.map(([v, t]) => `<option value=\"${v}\"${v === cur ? ' selected' : ''}>${t}<\/option>`).join('')}<\/select><\/label>`;\n      const fd = R.kind === 'V' ? `d = h − (rec + estribo + db·capas/2) = ${r2(R.h, 1)} − (${D.recViga} + ${D.estribo} + ${r2(R.bar.d, 3)}·${R.capas}/2) = ${r2(R.d, 2)} cm` : `d = h − (rec + db·capas/2) = ${r2(R.h, 1)} − (${D.recLosa} + ${r2(R.bar.d, 3)}·${R.capas}/2) = ${r2(R.d, 2)} cm`;\n      h += `<div class=\"card\" data-row=\"${esc(R.id)}\"><h3>${esc(R.elem)} · ${tn(R.tramo)} · ${R.sec} <small>${R.t === 'p' ? 'M+' : 'M−'}<\/small>${pill(R.st)}<\/h3>\n        <div class=\"row2\"><span class=\"big\">${R.nb} #${R.bar.n}${R.capas > 1 ? ` <small style=\"font-size:13px\">en ${R.capas} capas<\/small>` : ''}${R.kind !== 'V' ? ` <small style=\"font-size:13px\">@ ${fx(R.s, 1)} cm<\/small>` : ''}<\/span><span>Mu ${V(R.Mu, R.fM, 2, 'Mu (t·m)')} t·m<\/span><\/div>\n        <div class=\"kv\"><div><span>As requerido (cm²)<\/span>${V(R.Asreq, `As req. = máx(As mín, As) = máx(${r2(R.Amin, 2)}, ${r2(R.As, 2)}) = ${r2(R.Asreq, 2)} cm²`, 2, 'As req.')}<\/div>\n        <div><span>As colocado (cm²)<\/span>${V(R.Asr, `As real = ${R.nb}·${r2(R.bar.A, 3)} = ${r2(R.Asr, 2)} cm² (${R.exc >= 0 ? '+' : ''}${r2(R.exc * 100, 1)} %)`, 2, 'As real')}<\/div><\/div>\n        ${R.st !== 'ok' ? `<p class=\"why ${R.st}\">${esc(R.why)}<\/p>` : ''}\n        <div class=\"ctl\">${sel('bar', BARS.map(x => [x, '#' + x]), R.bar.n, 'Barra')}${sel('capas', [[1, '1 capa'], [2, '2 capas']], R.capas, 'Capas')}<\/div>\n        <details class=\"more\"><summary>Ver cálculo<\/summary><div class=\"kv\">\n          <div><span>b × h (cm)<\/span>${V(R.b, R.fb || 'b = ancho del alma de la viga', 0, 'b (cm)')} × ${fx(R.h, 0)}<\/div><div><span>d (cm)<\/span>${V(R.d, fd, 2, 'd')}<\/div>\n          <div><span>Mub (t·m)<\/span>${V(R.Mub, `Mub = Rub·b·d²/10⁵ = ${r2(R.Rub, 2)}·${r2(R.b, 0)}·${r2(R.d, 2)}²/10⁵ = ${r2(R.Mub, 2)} t·m`, 2, 'Mub')}<\/div>\n          <div><span>As calculado (cm²)<\/span>${V(R.As, R.doble ? `As = ρmax·b·d + (Mu − Mub)/(φ·fy·(d − d')) = ${r2(R.As1, 2)} + ${r2(R.As2, 2)}` : `de Mu = φ·As·fy·(d − As·fy/(1.7·f'c·b)) → ${r2(R.As, 2)} cm²`, 2, 'As')}<\/div>\n          <div><span>As mín (cm²)<\/span>${V(R.Amin, `As mín = máx(0.7·√f'c·b·d/fy, 14·b·d/fy) = ${r2(R.Amin, 2)} cm²`, 2, 'As mín')}<\/div>\n          <div><span>${R.kind === 'V' ? 'Sep. libre (cm)' : 'Separación (cm)'}<\/span>${R.kind === 'V' ? V(R.libre, `separación libre = (b − 2(rec + estribo) − n·db)/(n − 1) = ${r2(R.libre, 1)} cm; mín. ${r2(Math.max(2.5, R.bar.d), 1)} cm`, 1, 'Separación libre') : V(R.s, `s = b/Nº = ${r2(R.b, 0)}/${R.nb} = ${r2(R.s, 1)} cm; máx. ${r2(R.smax, 1)} cm`, 1, 's')}<\/div>\n          ${R.doble ? `<div><span>A's (cm²)<\/span>${V(R.Aspreq, `A's = As2·fy/f's → ${R.nbc} #${R.barc.n}`, 2, \"A's\")}<\/div>` : ''}\n        <\/div><\/details><\/div>`;\n    });\n    return h || '<p class=\"empty\">Sin secciones.<\/p>';\n  }\n\n  // ------------------------------------------------------------------ revisar\n  function tRevisar() {\n    const n = counts();\n    const ck = O.checks.slice().sort((a, b) => (a.status === 'bad' ? 0 : 1) - (b.status === 'bad' ? 0 : 1));\n    let h = `<div class=\"kv\" style=\"grid-template-columns:repeat(3,1fr)\"><div><span>Cumplen<\/span><b style=\"color:var(--ok)\">${n.ok}<\/b><\/div><div><span>Por revisar<\/span><b style=\"color:var(--warn)\">${n.warn}<\/b><\/div><div><span>Fallan<\/span><b style=\"color:var(--bad)\">${n.bad}<\/b><\/div><\/div>\n      <h2>Límites del método directo<\/h2><div class=\"card\" style=\"gap:0\">${O.lim.map(l => `<div class=\"chk\">${pill(l.st)}<span>${esc(l.t)}<small>${esc(l.d)}<\/small><\/span><\/div>`).join('')}<\/div>`;\n    const secs = ck.filter(c => c.ref.tab === 'acero');\n    h += `<h2>Secciones por revisar<\/h2><div class=\"card\" style=\"gap:0\">${secs.length ? secs.map(c => `<button type=\"button\" class=\"chk\" data-tab=\"acero\" data-id=\"${esc(c.ref.id)}\">${pill(c.status)}<span>${esc(c.title)}<small>${esc(c.detail)}<\/small><\/span><\/button>`).join('') : '<p class=\"empty\">Todas las secciones cumplen.<\/p>'}<\/div>`;\n    const pans = ck.filter(c => c.ref.tab === 'panos');\n    if (pans.length) h += `<h2>Paños<\/h2><div class=\"card\" style=\"gap:0\">${pans.map(c => `<button type=\"button\" class=\"chk\" data-tab=\"panos\" data-id=\"${esc(c.ref.id)}\">${pill(c.status)}<span>${esc(c.title)}<small>${esc(c.detail)}<\/small><\/span><\/button>`).join('')}<\/div>`;\n    return h;\n  }\n  // al tocar una sección por revisar, abrir su eje en Acero\n  $('main').addEventListener('click', e => {\n    const c = e.target.closest('.chk[data-tab=\"acero\"]'); if (!c) return;\n    e.stopImmediatePropagation();\n    const R = O.rows.find(r => r.id === c.dataset.id); if (!R) return;\n    ui.adir = R.id[0]; ui.akind = R.kind; ui.aeje = R.grp.split('|')[1];\n    go('acero', R.id);\n  }, true);\n\n  recompute();\n})();\n\n<\/script>\n\n<\/body><\/html>\n<\!-- FIC-INFO:inicio (icono de información con el email del autor) -->\n<style id=\"fic-info-css\">\n.fic-info-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;min-width:24px;min-height:24px;margin-inline-start:.45em;vertical-align:middle;border-radius:50%;color:inherit;opacity:.72;cursor:pointer;font-size:16px;line-height:1;text-transform:none;letter-spacing:0}\n.fic-info-btn:hover{opacity:1}\n.fic-info-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}\n.fic-info-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}\n.fic-info-abs{position:absolute;top:14px;right:14px;margin:0}\n.fic-info-pop{position:fixed;z-index:99999;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;padding:12px 14px;border-radius:10px;background:#fff;color:#1d1d1f;border:1px solid rgba(0,0,0,.14);box-shadow:0 8px 28px rgba(0,0,0,.18);font:400 14px/1.4 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;text-transform:none;letter-spacing:0;text-align:left}\n.fic-info-pop[hidden]{display:none}\n.fic-info-pop .k{font-size:12px;color:#6b6b70;margin-bottom:4px}\n.fic-info-pop .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.fic-info-pop a{color:#0b62c4;font-weight:600;text-decoration:none;word-break:break-all}\n.fic-info-pop a:hover{text-decoration:underline}\n.fic-info-pop button{font:inherit;font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid rgba(0,0,0,.2);background:transparent;color:inherit;cursor:pointer;min-height:24px}\n@media (prefers-color-scheme:dark){.fic-info-pop{background:#232326;color:#ececf0;border-color:rgba(255,255,255,.16)}.fic-info-pop .k{color:#a0a0a8}.fic-info-pop a{color:#7ab4ff}.fic-info-pop button{border-color:rgba(255,255,255,.25)}}\n@media print{.fic-info-btn,.fic-info-pop{display:none!important}}\n<\/style>\n<script id=\"fic-info-js\">\n(function(){\n  var EMAIL='neptaliagip@hotmail.com';\n  function init(){\n    if(document.querySelector('.fic-info-btn'))return;\n    var h=document.querySelector('header h1')||document.querySelector('h1');if(!h)return;\n    var b=document.createElement('button');b.type='button';b.className='fic-info-btn';\n    b.setAttribute('aria-label','Información de contacto');b.setAttribute('aria-expanded','false');b.title='Información';\n    b.innerHTML='<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"M12 11v6\"/><path d=\"M12 7.4v.1\" stroke-width=\"2.6\"/><\/svg>';\n    if(h.isContentEditable){var p=h.parentElement;if(getComputedStyle(p).position==='static')p.style.position='relative';b.classList.add('fic-info-abs');p.appendChild(b);}\n    else if(h.firstElementChild&&getComputedStyle(h.firstElementChild).display==='block')h.insertBefore(b,h.firstElementChild);\n    else h.appendChild(b);\n    var pop=document.createElement('div');pop.className='fic-info-pop';pop.hidden=true;pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Contacto');\n    pop.innerHTML='<div class=\"k\">Contacto del autor<\/div><div class=\"r\"><a href=\"mailto:'+EMAIL+'\">'+EMAIL+'<\/a><button type=\"button\">Copiar<\/button><\/div>';\n    document.body.appendChild(pop);\n    var cp=pop.querySelector('button');\n    function place(){var r=b.getBoundingClientRect(),w=pop.offsetWidth,x=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12);pop.style.left=x+'px';pop.style.top=(r.bottom+8)+'px';}\n    function show(v){pop.hidden=!v;b.setAttribute('aria-expanded',v?'true':'false');if(v)place();}\n    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();show(pop.hidden);});\n    cp.addEventListener('click',function(){var done=function(){cp.textContent='Copiado';setTimeout(function(){cp.textContent='Copiar';},1500);};\n      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(EMAIL).then(done,function(){});\n      else{var t=document.createElement('textarea');t.value=EMAIL;document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(_){}t.remove();}});\n    document.addEventListener('click',function(e){if(!pop.hidden&&!pop.contains(e.target)&&e.target!==b)show(false);});\n    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pop.hidden){show(false);b.focus();}});\n    addEventListener('resize',function(){if(!pop.hidden)place();});addEventListener('scroll',function(){if(!pop.hidden)place();},true);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n<\/script>\n<\!-- FIC-INFO:fin -->\n\n<script id=\"vista-switch\">\n(function(){\n  var ID=\"losa-maciza\", CUR=\"cel\";\n  function go(v){try{localStorage.setItem('vista:'+ID,v)}catch(e){}var u=new URL(location.href);u.searchParams.delete('vista');location.replace(u.toString());}\n  function add(){\n    var pop=document.querySelector('.fic-info-pop');\n    var label=CUR==='cel'?'Ver versión para computadora':'Ver versión para celular';\n    if(pop){var d=document.createElement('div');d.style.cssText='margin-top:10px;padding-top:8px;border-top:1px solid rgba(127,127,127,.3)';\n      var b=document.createElement('button');b.type='button';b.textContent=(CUR==='cel'?'🖥 ':'📱 ')+label;b.style.cssText='width:100%;font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid rgba(127,127,127,.4);background:transparent;color:inherit;cursor:pointer';\n      b.onclick=function(){go(CUR==='cel'?'pc':'cel')};d.appendChild(b);pop.appendChild(d);}\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();\n})();\n<\/script>\n";
  var v=null, q=new URLSearchParams(location.search).get('vista');
  if(q==='pc'||q==='cel'){v=q;try{localStorage.setItem('vista:'+ID,v)}catch(e){}}
